[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "pybind11>=2.2.3",
    "numpy",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "setuptools-scm"
]
build-backend = "setuptools.build_meta"

[project]
name = "acanalysis"
description = "analysis and alignment based on axonal skeletonizations"
requires-python = ">3.9,<3.12"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Connor Laughland"},
    {name = "Kevin Takasaki"},
    {name = "Russel Torres"},
]
# description = "Axonal connectomics reconstruction analysis"
dynamic = ["dependencies", "version"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools_scm]
version_file = "acanalysis/_version.py"

# some downgrades from pixi's expectations
[tool.pixi.system-requirements]
linux = "5.0.0"
libc = "2.27"

[tool.setuptools.packages.find]
include = ["acanalysis*"]

[tool.flake8]
ignore = ['E226', 'E126', 'E741']
max-line-length = 79

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
hdf5 = "*"

[tool.pixi.pypi-dependencies]
acanalysis = { path = ".", editable = true }

[tool.pixi.feature.py39.dependencies]
python = "3.9.*"

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

# [tool.pixi.feature.scalene.dependencies]
# scalene = "*"

[tool.pixi.environments]
default = ["py310"]
# py39-conda-scalene = ["py39", "scalene"]
# py310-conda-scalene = ["py310", "scalene"]

[tool.pixi.feature.test.tasks]
test = "pytest  --cov --cov-report=xml --junitxml=test-reports/test.xml"
