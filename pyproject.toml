[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "pybind11>=2.2.3",
    "pytest",
    "pytest-cov",
    "pytest-mock",
]
build-backend = "setuptools.build_meta"

[project]
name = "acanalysis"
version = "0.0.0"
authors = [
    {name = "Russel Torres"},
]
description = "Axonal connectomics reconstruction analysis"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["acanalysis*"]

[tool.flake8]
ignore = ['E226', 'E126', 'E741']
max-line-length = 79

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
acanalysis = { path = ".", editable = true }

[tool.pixi.feature.py38.dependencies]
python = "3.8.*"

[tool.pixi.feature.py39.dependencies]
python = "3.9.*"
numpy = "1.22.0"

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"
numpy = "1.22.0"

[tool.pixi.feature.scalene.dependencies]
scalene = "*"

[tool.pixi.environments]
default = ["py310"]
py38-conda-scalene = ["py38", "scalene"]
py39-conda-scalene = ["py39", "scalene"]
py310-conda-scalene = ["py310", "scalene"]

[tool.pixi.feature.test.tasks]
test = "pytest  --cov --cov-report=xml --junitxml=test-reports/test.xml"
